# ============================================================
#  坐标补充表
#  给「照片自己没有 EXIF 坐标」的照片手动补坐标
# ============================================================
#
#  读取顺序（就这一个逻辑）：
#    ① 照片自己的 EXIF 坐标  → 有就用它，不用写在这里
#    ② 这张表里单张指定的     → EXIF 没有时读它
#    ③ 都没有                → 这张照片不出现在地图上
#
#  格式：  纬度, 经度
#      先纬度、后经度，中间一个英文逗号。例如：
#        39.1342, 117.2010
#      纬度范围 -90~90，经度 -180~180。
#
#  ⚠️ 必须写 WGS-84 国际坐标 ——
#     也就是 GeoSetter、Google 地图上取到的那种。
#     高德/百度地图上抄来的坐标是加密过的（GCJ-02 / BD-09），
#     直接写进来会比真实位置偏几百米。
#
#  写反了怎么办：纬度不可能超过 90，所以写成 "117.2, 39.1"
#  脚本会发现并自动换回来，同时在终端给你一行提醒。
#
#  想确认落点对不对：跑完 sync.js 后打开 /map/ 看那个点在哪。
# ============================================================

photos:
  # 一行一张，写完整路径（R2 桶里从目录开始的那一串）：
  #
  china/tianjin/Z30_0534.JPG: 39.115469, 117.215194
  # china/tianjin/Z30_0559.JPG: 39.1342, 117.2010
  # china/tianjin/Z30_0572.JPG: 39.1342, 117.2010
  china/tianjin/Z30_0579.JPG: 39.127646, 117.210789
