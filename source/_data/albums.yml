# ============================================================
#  相册清单
#  以后加照片，只改这个文件，网页会自动生成
# ============================================================
#
#  photos —— 一行一张照片
#      写法：R2 里的路径 | 说明文字
#      说明文字可以省略，省略时页面上就显示文件名
#      路径必须和 R2 桶里的目录、文件名完全一致，大小写也要一致
#
#  names —— 目录名 → 显示的中文名
#      照片路径里出现过几层目录，就在这里登记几行
#      没登记的目录，页面上会直接显示英文名
#
#  层数不用你声明：路径里有几个斜杠，相册就自动分几层
# ============================================================

photos:
  - china/sichuan/a-ba/1772962664015.jpg | 阿坝 · 清晨

  # 以后照着上面加行就行，例如：
  # - china/sichuan/chengdu/20260901120000.jpg | 宽窄巷子
  # - china/shanghai/IMG20260405150924.jpg | 外滩 · 入夜
  # - japan/tokyo/IMG20260512103000.jpg | 涩谷路口

names:
  china: 中国
  sichuan: 四川
  a-ba: 阿坝
  # chengdu: 成都
  # shanghai: 上海
  # japan: 日本
  # tokyo: 东京
